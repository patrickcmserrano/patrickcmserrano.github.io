<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <clipPath id="circle"><circle cx="256" cy="256" r="256"/></clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g clip-path="url(#circle)">
    <rect width="512" height="512" fill="#0a0a14"/>
    <circle cx="150" cy="130" r="150" fill="#8b5cf6" opacity="0.13"/>
    <circle cx="380" cy="400" r="170" fill="#ec4899" opacity="0.11"/>
  </g>

  <g filter="url(#glow)">
    <g stroke="url(#g)" stroke-width="26" stroke-linecap="round">
      <line x1="256" y1="256" x2="128" y2="128"/>
      <line x1="256" y1="256" x2="384" y2="128"/>
      <line x1="256" y1="256" x2="128" y2="384"/>
      <line x1="256" y1="256" x2="384" y2="384"/>
    </g>
    <g fill="url(#g)">
      <circle cx="128" cy="128" r="40"/>
      <circle cx="384" cy="128" r="40"/>
      <circle cx="128" cy="384" r="40"/>
      <circle cx="384" cy="384" r="40"/>
    </g>
    <circle cx="256" cy="256" r="58" fill="#0a0a14" stroke="url(#g)" stroke-width="26"/>
  </g>
</svg>

sgo como regla inmutable y ejecutan. Se organiza como una familia de componentes bajo el prefijo Ark — ingestión, motor de decisión y terminal de operación."},stack:["Go","Clojure","NATS JetStream","XTDB","ClojureScript","Wails"],projects:[{id:"ark-streams",title:{pt:"Ark Streams",en:"Ark Streams",es:"Ark Streams"},subtitle:{pt:"Sistema Sensorial & Pipeline de Ingestão Quantitativa",en:"Sensory System & Quantitative Ingestion Pipeline",es:"Sistema Sensorial y Canal de Ingestión Cuantitativa"},excerpt:{pt:"Um pipeline em Go para ingestão paralela de order books, cálculo de indicadores em tempo real e publicação de sinais via NATS JetStream. Coleta de Bitget, OKX, Bybit (perpétuos, liquidações, funding, open interest) e commodities via Yahoo REST.",en:"A high-performance Go pipeline for parallel order book ingestion, real-time indicator computation, and signal publication over NATS JetStream. Collects from Bitget, OKX, Bybit (perpetuals, liquidations, funding, open interest) plus commodities via Yahoo REST.",es:"Canal en Go de alto rendimiento para ingestión paralela de order books, cálculo de indicadores en tiempo real y publicación de señales vía NATS JetStream. Colecta de Bitget, OKX, Bybit (perpetuos, liquidaciones, funding, open interest) más commodities vía Yahoo REST."},excerptShort:{pt:"Pipeline em Go de ingestão paralela de mercado e sinais via NATS JetStream.",en:"Go pipeline for parallel market ingestion and signalling over NATS JetStream.",es:"Canal en Go de ingestión paralela de mercado y señales vía NATS JetStream."},url:"https://nexus-quantitative.github.io/"},{id:"ark-engine",title:{pt:"Ark Engine",en:"Ark Engine",es:"Ark Engine"},subtitle:{pt:"Ledger Bitemporal de Auditoria de Mercado",en:"Bitemporal Market Audit Ledger",es:"Ledger Bitemporal de Auditoría de Mercado"},excerpt:{pt:"Infraestrutura de dados de mercado em Clojure, com arquitetura Polylith. O núcleo em produção é um ledger bitemporal em XTDB que registra cada evento de mercado com tempo de validade distinto do tempo de transação — a propriedade que permite backtests sem viés de ponto no tempo. A camada de risco (Trading Policy Statement NQ-GOV-001) está implementada e testada, com o caminho de execução ao vivo ainda em construção.",en:"Market-data infrastructure in Clojure with a Polylith architecture. The production core is a bitemporal ledger in XTDB that records each market event with a valid time distinct from its transaction time — the property that enables point-in-time correct backtesting. The risk layer (Trading Policy Statement NQ-GOV-001) is implemented and tested, with the live execution path still under construction.",es:"Infraestructura de datos de mercado en Clojure con arquitectura Polylith. El núcleo en producción es un ledger bitemporal en XTDB que registra cada evento de mercado con tiempo de validez distinto del tiempo de transacción — la propiedad que permite backtests sin sesgo de punto en el tiempo. La capa de riesgo (Trading Policy Statement NQ-GOV-001) está implementada y probada, con el camino de ejecución en vivo aún en construcción."},excerptShort:{pt:"Ledger bitemporal em XTDB para dados de mercado: correção ponto-no-tempo para backtest.",en:"XTDB bitemporal ledger for market data: point-in-time correctness for backtesting.",es:"Ledger bitemporal en XTDB para datos de mercado: corrección punto-en-el-tiempo para backtest."},url:"https://nexus-quantitative.github.io/"},{id:"ark-terminal",title:{pt:"Ark Terminal",en:"Ark Terminal",es:"Ark Terminal"},subtitle:{pt:"Console Desktop de Operação e Monitoramento",en:"Desktop Operations & Monitoring Console",es:"Consola de Escritorio de Operación y Monitoreo"},excerpt:{pt:"O painel visual e de controle da linha Nexus Quant. Aplicativo desktop nativo escrito em Go, Svelte e Wails, conectado ao backend via NATS JetStream para exibir mercado, agressão, liquidações, backtests e sinais de estratégia em tempo real.",en:"The visual control panel of the Nexus Quant line. A native desktop application written in Go, Svelte, and Wails, connected to the backend over NATS JetStream to display market data, aggression, liquidations, backtests, and strategy signals in real time.",es:"El panel visual y de control de la línea Nexus Quant. Aplicación de escritorio nativa escrita en Go, Svelte y Wails, conectada al backend vía NATS JetStream para mostrar mercado, agresión, liquidaciones, backtests y señales de estrategia en tiempo real."},excerptShort:{pt:"Aplicativo desktop nativo (Go + Svelte + Wails) para operação e monitoramento em tempo real.",en:"Native desktop application (Go + Svelte + Wails) for real-time operations and monitoring.",es:"Aplicación de escritorio nativa (Go + Svelte + Wails) para operación y monitoreo en tiempo real."},url:"https://nexus-quantitative.github.io/"}]},{id:"ping-hai",name:"Ping Hai",subtitle:{pt:"Plataformas privadas de IA — marca comercial e entidade contratante",en:"Private AI platforms — commercial brand and contracting entity",es:"Plataformas privadas de IA — marca comercial y entidad contratante"},role:{pt:"Fundador & Arquiteto de Software",en:"Founder & Software Architect",es:"Fundador y Arquitecto de Software"},status:{pt:"Operação ativa",en:"Active operation",es:"Operación activa"},excerpt:{pt:"Ping Hai monta plataformas de IA privadas. O time conversa com os próprios documentos, em português, sob a identidade que já tem — e nada sai para fora: o conteúdo, a identidade e o modelo ficam na infraestrutura da empresa. É também a entidade comercial sob a qual essa linha é contratada e entregue.",en:"Ping Hai builds private AI platforms. The team talks to its own documents, in Portuguese, under the identity it already has — and nothing leaves the building: the content, the identity, and the model stay in the company's infrastructure. It is also the commercial entity under which this line is contracted and delivered.",es:"Ping Hai monta plataformas privadas de IA. El equipo conversa con sus propios documentos, en portugués, bajo la identidad que ya tiene — y nada sale afuera: el contenido, la identidad y el modelo quedan en la infraestructura de la empresa. Es también la entidad comercial bajo la cual se contrata y entrega esta línea."},stack:["Open WebUI","Keycloak / SSO","OpenLDAP","vLLM","Slurm","pgvector"],projects:[{id:"ai-factory",title:{pt:"AI Factory",en:"AI Factory",es:"AI Factory"},subtitle:{pt:"Plataforma Privada de IA — Chat com os Documentos da Empresa",en:"Private AI Platform — Chat with the Company's Documents",es:"Plataforma Privada de IA — Chat con los Documentos de la Empresa"},excerpt:{pt:"Os documentos da sua empresa, num chat privado, rodando na infraestrutura dela. O time conversa com os próprios documentos, em português, sob a identidade que já tem — e nada sai para fora. Já entregue e em produção.",en:"The company's documents, in a private chat, running on its own infrastructure. The team talks to its own documents, in Portuguese, under the identity it already has — and nothing leaves the building. Already delivered and in production.",es:"Los documentos de su empresa, en un chat privado, corriendo en su propia infraestructura. El equipo conversa con sus propios documentos, en portugués, bajo la identidad que ya tiene — y nada sale afuera. Ya entregado y en producción."},excerptShort:{pt:"Plataforma privada de IA: chat com os documentos da empresa, na infraestrutura dela.",en:"Private AI platform: chat with the company's documents, on its own infrastructure.",es:"Plataforma privada de IA: chat con los documentos de la empresa, en su propia infraestructura."},url:"https://patrickcmserrano.github.io/trabalho/ai-factory/"},{id:"small-router",title:{pt:"small-router",en:"small-router",es:"small-router"},subtitle:{pt:"Camada de Inferência Provider-Agnostic para Agentes de Código",en:"Provider-Agnostic Inference Layer for Coding Agents",es:"Capa de Inferencia Provider-Agnostic para Agentes de Código"},excerpt:{pt:"Um único endpoint compatível com OpenAI à frente de múltiplos provedores de LLM, com roteamento, fallback, retry e circuit breaking. O roteamento, a resiliência e a fronteira de segurança ficam em um ponto só, em vez de espalhados pelos clientes.",en:"One OpenAI-compatible endpoint in front of multiple LLM providers, with routing, fallback, retry, and circuit breaking. Routing, resilience, and the security boundary live in a single place instead of scattered across clients.",es:"Un único endpoint compatible con OpenAI frente a múltiples proveedores de LLM, con enrutamiento, fallback, retry y circuit breaking. El enrutamiento, la resiliencia y la frontera de seguridad viven en un solo lugar en lugar de repartidos entre los clientes."},excerptShort:{pt:"Endpoint único à frente de múltiplos provedores, com roteamento, fallback e circuit breaking.",en:"Single endpoint in front of multiple providers, with routing, fallback, and circuit breaking.",es:"Endpoint único frente a múltiples proveedores, con enrutamiento, fallback y circuit breaking."},url:"https://patrickcmserrano.github.io/trabalho/small-router/"}]},{id:"moleque",name:"Moleque de Ideias",subtitle:{pt:"Software house — experiência profissional 2018-2025",en:"Software house — professional experience 2018-2025",es:"Software house — experiencia profesional 2018-2025"},role:{pt:"Desenvolvedor de Software (Fullstack)",en:"Software Developer (Fullstack)",es:"Desarrollador de Software (Fullstack)"},status:{pt:"2018 - 2025",en:"2018 - 2025",es:"2018 - 2025"},excerpt:{pt:"Sete anos construindo sistemas de pagamento, e-commerce, imobiliários e de gestão de catálogos — do estágio em frontend à liderança técnica de arquitetura. Atuei como estágio (2018-2019), júnior (2019-2021) e pleno (2021-2025), com foco em refatoração, integração de APIs, arquitetura de software e automatização de processos.",en:"Seven years building payment, e-commerce, real estate, and catalog-management systems — from a frontend internship to technical leadership in architecture. I worked as an intern

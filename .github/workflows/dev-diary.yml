name: Weekly Dev Diary Generator

on:
  schedule:
    # Roda toda segunda-feira às 12:00 UTC (09:00 BRT)
    - cron: '0 12 * * 1'
  workflow_dispatch: # Permite execução manual

jobs:
  generate-diary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install Babashka
        uses: houseabsolute/setup-babashka@v1
        with:
          babashka-version: '1.12.218'

      - name: Run Dev Diary Pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          bb diary

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/posts.json static/posts/*.md
          if git diff --staged --quiet; then
            echo "Nenhuma alteração para commitar."
          else
            git commit -m "chore: auto-generate weekly dev diary [skip ci]"
            git push
          fi
